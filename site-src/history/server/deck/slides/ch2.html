<section id="ch2" data-transition="fade" style="background:#1B2A4A;color:#F4F1EA;font-family:'Public Sans', Arial, sans-serif;padding:128px;display:flex;flex-direction:column;justify-content:center;gap:40px"><p style="font-size:32px;font-weight:700;color:#C9D2E3;letter-spacing:4px;text-transform:uppercase">Chapter 2 · 1990 to 1995</p><h2 style="font-family:'Libre Baskerville', Georgia, serif;font-size:96px;font-weight:700;line-height:1.1">The first servers hand out files</h2><p style="font-size:40px;line-height:1.4;color:#C9D2E3">A web server begins as a simple program: it waits for a request, finds a file and sends it back.</p><div style="display:flex;gap:16px"><p style="font-size:28px;font-weight:700;color:#1B2A4A;background:#8CC9A6;padding:8px 24px;border-radius:24px">Server</p><p style="font-size:28px;font-weight:700;color:#1B2A4A;background:#E8955C;padding:8px 24px;border-radius:24px">HTML</p></div><aside>The browser asks for a page, and a program on another computer answers. This chapter is about that program.</aside></section>
