<section id="ch5" data-transition="fade" style="background:#1B2A4A;color:#F4F1EA;font-family:'Public Sans', Arial, sans-serif;padding:128px;display:flex;flex-direction:column;justify-content:center;gap:40px"><p style="font-size:32px;font-weight:700;color:#C9D2E3;letter-spacing:4px;text-transform:uppercase">Chapter 5 · 2006 to 2019</p><h2 style="font-family:'Libre Baskerville', Georgia, serif;font-size:96px;font-weight:700;line-height:1.1">Someone else’s computer</h2><p style="font-size:40px;line-height:1.4;color:#C9D2E3">Servers move out of the back room and into rented data centres. You pay for what you use.</p><div style="display:flex;gap:16px"><p style="font-size:28px;font-weight:700;color:#1B2A4A;background:#8CC9A6;padding:8px 24px;border-radius:24px">Server</p><p style="font-size:28px;font-weight:700;color:#1B2A4A;background:#B9A6E0;padding:8px 24px;border-radius:24px">Database</p></div><aside>The phrase “the cloud is just someone else’s computer” is a joke, and it is also accurate. This chapter explains what is rented and why.</aside></section>
