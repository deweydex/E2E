<section id="ch3" data-transition="fade" style="background:#1B2A4A;color:#F4F1EA;font-family:'Public Sans', Arial, sans-serif;padding:128px;display:flex;flex-direction:column;justify-content:center;gap:40px"><p style="font-size:32px;font-weight:700;color:#C9D2E3;letter-spacing:4px;text-transform:uppercase">Chapter 3 · 1995 to 2004</p><h2 style="font-family:'Libre Baskerville', Georgia, serif;font-size:96px;font-weight:700;line-height:1.1">Pages built from a database</h2><p style="font-size:40px;line-height:1.4;color:#C9D2E3">Cheap hosting and free software put a database behind ordinary websites. The server now remembers.</p><div style="display:flex;gap:16px"><p style="font-size:28px;font-weight:700;color:#1B2A4A;background:#8CC9A6;padding:8px 24px;border-radius:24px">Server</p><p style="font-size:28px;font-weight:700;color:#1B2A4A;background:#B9A6E0;padding:8px 24px;border-radius:24px">Database</p></div><aside>Many sites still follow the pattern in this chapter: a server language, a SQL database and HTML built on each request.</aside></section>
