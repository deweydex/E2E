</style><rect width="1080" height="640" rx="12" fill="var(--surface)"/><defs><marker id="ah5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--accent)"/></marker></defs><rect class="zone-db" x="30" y="24" width="640" height="76" rx="10"/><text class="strong" x="46" y="52" font-size="16">1. A row in the database</text><text class="mono" x="46" y="80" font-size="12">A1 | Sparkling Water | 175 | 7</text><text class="t-muted" x="698" y="68" font-size="15">On the server&#x27;s disk, inside the SQLite file</text><path class="arrow" d="M 120 104 L 120 150" marker-end="url(#ah5)"/><text class="mono" x="140" y="132.0" font-size="13">selectOneSlot.get(slotId)</text><rect class="zone-good" x="30" y="154" width="640" height="76" rx="10"/><text class="strong" x="46" y="182" font-size="16">2. A JavaScript object in the server</text><text class="mono" x="46" y="210" font-size="12">{ slot_id: &#x27;A1&#x27;, item_name: &#x27;Sparkling Water&#x27;, price_cents: 175, stock: 7 }</text><text class="t-muted" x="698" y="198" font-size="15">In the memory of the server program</text><path class="arrow" d="M 120 234 L 120 280" marker-end="url(#ah5)"/><text class="mono" x="140" y="262.0" font-size="13">JSON.stringify(slot)</text><rect class="zone-bad" x="30" y="284" width="640" height="76" rx="10"/><text class="strong" x="46" y="312" font-size="16">3. Text on the network (JSON)</text><text class="mono" x="46" y="340" font-size="12">{&quot;slot_id&quot;:&quot;A1&quot;,&quot;item_name&quot;:&quot;Sparkling Water&quot;,&quot;price_cents&quot;:175,&quot;stock&quot;:7}</text><text class="t-muted" x="698" y="328" font-size="15">On the network, as bytes</text><path class="arrow" d="M 120 364 L 120 410" marker-end="url(#ah5)"/><text class="mono" x="140" y="392.0" font-size="13">response.json()</text><rect class="seg1" x="30" y="414" width="640" height="76" rx="10" style="stroke: var(--line); stroke-width: 2"/><text class="strong" x="46" y="442" font-size="16">4. An object in the page&#x27;s script</text><text class="mono" x="46" y="470" font-size="12">{ slot_id: &quot;A1&quot;, item_name: &quot;Sparkling Water&quot;, price_cents: 175, stock: 7 }</text><text class="t-muted" x="698" y="458" font-size="15">In the memory of the page&#x27;s script</text><path class="arrow" d="M 120 494 L 120 540" marker-end="url(#ah5)"/><text class="mono" x="140" y="522.0" font-size="13">createSlotCard(slot)</text><rect class="seg1" x="30" y="544" width="640" height="76" rx="10" style="stroke: var(--line); stroke-width: 2"/><text class="strong" x="46" y="572" font-size="16">5. Elements in the DOM</text><text class="mono" x="46" y="600" font-size="12">&lt;p class=&quot;stock&quot;&gt;7 left&lt;/p&gt;</text><text class="t-muted" x="698" y="588" font-size="15">In the browser&#x27;s DOM, then on the screen</text></svg>
