<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 500" role="img" aria-label="A URL split into scheme, host, port and path, and the path matched against a route pattern that captures the slot id and passes it to the handler."><title>A URL split into scheme, host, port and path, and the path matched against a route pattern that captures the slot id and passes it to the handler.</title><style>
:root {
  --bg: #fbfaf6;
  --surface: #ffffff;
  --surface-2: #f2efe6;
  --code-bg: #f4f1e8;
  --text: #1d2430;
  --muted: #586071;
  --line: #ddd7c8;
  --accent: #0b6e6e;
  --accent-soft: #dcefee;
  --on-accent: #ffffff;
  --warn: #8a5300;
  --warn-soft: #fbefd6;
  --bad: #a4262c;
  --bad-soft: #f8e2e3;
  --good: #25663a;
  --good-soft: #e0f1e5;
  --tok-keyword: #8a2b9b;
  --tok-string: #1c6b3a;
  --tok-comment: #6b7280;
  --tok-func: #0a58a8;
  --tok-number: #a34a00;
  --tok-name: #0b6e6e;
  --seg1: #cfe6f6;
  --seg2: #f6e1be;
  --seg3: #e2d3f3;
  --seg4: #cdeed4;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #12161d;
    --surface: #1a2029;
    --surface-2: #222a36;
    --code-bg: #0f131a;
    --text: #e6e9ef;
    --muted: #a0a9b8;
    --line: #2d3644;
    --accent: #5fcaca;
    --accent-soft: #163a3c;
    --on-accent: #0b1a1a;
    --warn: #f0b34d;
    --warn-soft: #3a2c10;
    --bad: #ff8f95;
    --bad-soft: #3d1b1e;
    --good: #7fd49a;
    --good-soft: #14301f;
    --tok-keyword: #d79bef;
    --tok-string: #8fd9a8;
    --tok-comment: #8b94a5;
    --tok-func: #7db8f5;
    --tok-number: #f2a864;
    --tok-name: #5fcaca;
  --seg1: #1f4560;
  --seg2: #5a4219;
  --seg3: #46316a;
  --seg4: #1f5133;
  }
}
svg text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--text); }
svg .t-muted { fill: var(--muted); }
svg .t-on { fill: var(--on-accent); font-weight: 700; }
svg .lane { stroke: var(--line); stroke-width: 2; stroke-dasharray: 5 6; }
svg .head { fill: var(--surface-2); stroke: var(--line); stroke-width: 1.5; }
svg .note { fill: var(--surface); stroke: var(--line); stroke-width: 1.5; }
svg .arrow { stroke: var(--accent); stroke-width: 2.5; fill: none; }
svg .arrow.back { stroke: var(--muted); stroke-dasharray: 7 5; }
svg .arrow.bad { stroke: var(--bad); stroke-dasharray: 7 5; }
svg .dot { fill: var(--accent); }
svg .zone-bad { fill: var(--warn-soft); stroke: var(--warn); stroke-width: 2; }
svg .zone-good { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 2; }
svg .zone-db { fill: var(--surface-2); stroke: var(--muted); stroke-width: 2; }
svg .strong { font-weight: 700; }
svg text.mono { font-family: ui-monospace, Menlo, Consolas, "DejaVu Sans Mono", monospace; }
svg .seg1 { fill: var(--seg1); }
svg .seg2 { fill: var(--seg2); }
svg .seg3 { fill: var(--seg3); }
svg .seg4 { fill: var(--seg4); }
</style><rect width="1080" height="500" rx="12" fill="var(--surface)"/><defs><marker id="ah2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--accent)"/></marker></defs><rect class="seg1" x="100" y="52" width="76" height="50" rx="6"/><text x="100" y="86" class="mono" font-size="32" textLength="76" lengthAdjust="spacing">http</text><text x="176" y="86" class="mono" font-size="32" textLength="57" lengthAdjust="spacing">://</text><rect class="seg2" x="233" y="52" width="171" height="50" rx="6"/><text x="233" y="86" class="mono" font-size="32" textLength="171" lengthAdjust="spacing">127.0.0.1</text><rect class="seg3" x="404" y="52" width="95" height="50" rx="6"/><text x="404" y="86" class="mono" font-size="32" textLength="95" lengthAdjust="spacing">:8000</text><rect class="seg4" x="499" y="52" width="190" height="50" rx="6"/><text x="499" y="86" class="mono" font-size="32" textLength="190" lengthAdjust="spacing">/api/slots</text><rect class="seg4" x="689" y="52" width="57" height="50" rx="6"/><text x="689" y="86" class="mono" font-size="32" textLength="57" lengthAdjust="spacing">/A1</text><rect class="seg4" x="746" y="52" width="76" height="50" rx="6"/><text x="746" y="86" class="mono" font-size="32" textLength="76" lengthAdjust="spacing">/buy</text><rect class="seg1" x="100" y="132" width="22" height="22" rx="4"/><text class="strong" x="136" y="150" font-size="16">scheme</text><text x="210" y="150" font-size="15.5">The protocol. Here it is plain HTTP, the agreement from Part 4.</text><rect class="seg2" x="100" y="170" width="22" height="22" rx="4"/><text class="strong" x="136" y="188" font-size="16">host</text><text x="210" y="188" font-size="15.5">Which computer. This address always means this computer.</text><rect class="seg3" x="100" y="208" width="22" height="22" rx="4"/><text class="strong" x="136" y="226" font-size="16">port</text><text x="210" y="226" font-size="15.5">Which program on that computer. Our server listens here.</text><rect class="seg4" x="100" y="246" width="22" height="22" rx="4"/><text class="strong" x="136" y="264" font-size="16">path</text><text x="210" y="264" font-size="15.5">Which thing, and what to do with it. The route table reads this part.</text><text class="t-muted" x="40" y="342" font-size="14">How the server reads the path</text><rect class="note" x="40" y="358" width="250" height="74" rx="8"/><text class="t-muted" x="52" y="380" font-size="13">The path</text><text x="52" y="410" class="mono" font-size="15.5">/api/slots/A1/buy</text><rect class="note" x="370" y="358" width="340" height="74" rx="8"/><text class="t-muted" x="382" y="380" font-size="13">A row of the route table</text><text x="382" y="410" class="mono" font-size="15.5">/api/slots/([^/]+)/buy</text><rect class="note" x="790" y="358" width="260" height="74" rx="8"/><text class="t-muted" x="802" y="380" font-size="13">The handler call</text><text x="802" y="410" class="mono" font-size="15.5">handleBuySlot(&quot;A1&quot;)</text><path class="arrow" d="M 292 395 L 366 395" marker-end="url(#ah2)"/><text x="329" y="450" font-size="13" text-anchor="middle">is tried against</text><path class="arrow" d="M 712 395 L 786 395" marker-end="url(#ah2)"/><text x="749" y="450" font-size="13" text-anchor="middle">captured text "A1"</text></svg>
