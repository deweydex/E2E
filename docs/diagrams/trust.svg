<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 400" role="img" aria-label="The visitor controls the browser, so the server checks every request. Only the server has a route to the database."><title>The visitor controls the browser, so the server checks every request. Only the server has a route to the database.</title><style>
:root {
  --bg: #fbfaf6;
  --surface: #ffffff;
  --surface-2: #f2efe6;
  --code-bg: #f4f1e8;
  --text: #1d2430;
  --muted: #586071;
  --line: #ddd7c8;
  --accent: #0b6e6e;
  --accent-soft: #dcefee;
  --on-accent: #ffffff;
  --warn: #8a5300;
  --warn-soft: #fbefd6;
  --bad: #a4262c;
  --bad-soft: #f8e2e3;
  --good: #25663a;
  --good-soft: #e0f1e5;
  --tok-keyword: #8a2b9b;
  --tok-string: #1c6b3a;
  --tok-comment: #6b7280;
  --tok-func: #0a58a8;
  --tok-number: #a34a00;
  --tok-name: #0b6e6e;
  --seg1: #cfe6f6;
  --seg2: #f6e1be;
  --seg3: #e2d3f3;
  --seg4: #cdeed4;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #12161d;
    --surface: #1a2029;
    --surface-2: #222a36;
    --code-bg: #0f131a;
    --text: #e6e9ef;
    --muted: #a0a9b8;
    --line: #2d3644;
    --accent: #5fcaca;
    --accent-soft: #163a3c;
    --on-accent: #0b1a1a;
    --warn: #f0b34d;
    --warn-soft: #3a2c10;
    --bad: #ff8f95;
    --bad-soft: #3d1b1e;
    --good: #7fd49a;
    --good-soft: #14301f;
    --tok-keyword: #d79bef;
    --tok-string: #8fd9a8;
    --tok-comment: #8b94a5;
    --tok-func: #7db8f5;
    --tok-number: #f2a864;
    --tok-name: #5fcaca;
  --seg1: #1f4560;
  --seg2: #5a4219;
  --seg3: #46316a;
  --seg4: #1f5133;
  }
}
svg text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--text); }
svg .t-muted { fill: var(--muted); }
svg .t-on { fill: var(--on-accent); font-weight: 700; }
svg .lane { stroke: var(--line); stroke-width: 2; stroke-dasharray: 5 6; }
svg .head { fill: var(--surface-2); stroke: var(--line); stroke-width: 1.5; }
svg .note { fill: var(--surface); stroke: var(--line); stroke-width: 1.5; }
svg .arrow { stroke: var(--accent); stroke-width: 2.5; fill: none; }
svg .arrow.back { stroke: var(--muted); stroke-dasharray: 7 5; }
svg .arrow.bad { stroke: var(--bad); stroke-dasharray: 7 5; }
svg .dot { fill: var(--accent); }
svg .zone-bad { fill: var(--warn-soft); stroke: var(--warn); stroke-width: 2; }
svg .zone-good { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 2; }
svg .zone-db { fill: var(--surface-2); stroke: var(--muted); stroke-width: 2; }
svg .strong { font-weight: 700; }
svg text.mono { font-family: ui-monospace, Menlo, Consolas, "DejaVu Sans Mono", monospace; }
svg .seg1 { fill: var(--seg1); }
svg .seg2 { fill: var(--seg2); }
svg .seg3 { fill: var(--seg3); }
svg .seg4 { fill: var(--seg4); }
</style><rect width="1080" height="400" rx="12" fill="var(--surface)"/><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--accent)"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--bad)"/></marker></defs><rect class="zone-bad" x="30" y="120" width="300" height="220" rx="12"/><text class="strong" x="180.0" y="156" text-anchor="middle" font-size="18">The visitor's browser</text><text class="t-muted" x="180.0" y="180" text-anchor="middle" font-size="14.5">Not under our control</text><text x="180.0" y="222" text-anchor="middle" font-size="15">The visitor can edit the page,</text><text x="180.0" y="250" text-anchor="middle" font-size="15">run any script in the console,</text><text x="180.0" y="278" text-anchor="middle" font-size="15">or send requests by hand.</text><rect class="zone-good" x="390" y="120" width="300" height="220" rx="12"/><text class="strong" x="540.0" y="156" text-anchor="middle" font-size="18">Our server</text><text class="t-muted" x="540.0" y="180" text-anchor="middle" font-size="14.5">Under our control</text><text x="540.0" y="222" text-anchor="middle" font-size="15">It checks every request,</text><text x="540.0" y="250" text-anchor="middle" font-size="15">owns every SQL statement,</text><text x="540.0" y="278" text-anchor="middle" font-size="15">and decides what is allowed.</text><rect class="zone-db" x="750" y="120" width="300" height="220" rx="12"/><text class="strong" x="900.0" y="156" text-anchor="middle" font-size="18">The database</text><text class="t-muted" x="900.0" y="180" text-anchor="middle" font-size="14.5">Reachable only from the server</text><text x="900.0" y="222" text-anchor="middle" font-size="15">It holds the data and the rules</text><text x="900.0" y="250" text-anchor="middle" font-size="15">(constraints) that protect it,</text><text x="900.0" y="278" text-anchor="middle" font-size="15">and it never faces the visitor.</text><path class="arrow" d="M 330 215 L 388 215" marker-end="url(#ah)"/><path class="arrow" d="M 690 215 L 748 215" marker-end="url(#ah)"/><text x="360" y="203" text-anchor="middle" font-size="13">requests</text><text x="720" y="203" text-anchor="middle" font-size="13">our SQL</text><path class="arrow bad" d="M 180 118 C 180 40, 900 40, 900 116" marker-end="url(#ahb)"/><text class="strong" x="540" y="62" text-anchor="middle" font-size="16" style="fill: var(--bad)">No direct route from the browser to the database</text></svg>
