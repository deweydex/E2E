<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 850" role="img" aria-label="Sequence diagram of one click: twelve numbered stations across the browser, the server and the database, from the click to the repainted screen."><title>Sequence diagram of one click: twelve numbered stations across the browser, the server and the database, from the click to the repainted screen.</title><style>
:root {
  --bg: #fbfaf6;
  --surface: #ffffff;
  --surface-2: #f2efe6;
  --code-bg: #f4f1e8;
  --text: #1d2430;
  --muted: #586071;
  --line: #ddd7c8;
  --accent: #0b6e6e;
  --accent-soft: #dcefee;
  --on-accent: #ffffff;
  --warn: #8a5300;
  --warn-soft: #fbefd6;
  --bad: #a4262c;
  --bad-soft: #f8e2e3;
  --good: #25663a;
  --good-soft: #e0f1e5;
  --tok-keyword: #8a2b9b;
  --tok-string: #1c6b3a;
  --tok-comment: #6b7280;
  --tok-func: #0a58a8;
  --tok-number: #a34a00;
  --tok-name: #0b6e6e;
  --seg1: #cfe6f6;
  --seg2: #f6e1be;
  --seg3: #e2d3f3;
  --seg4: #cdeed4;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #12161d;
    --surface: #1a2029;
    --surface-2: #222a36;
    --code-bg: #0f131a;
    --text: #e6e9ef;
    --muted: #a0a9b8;
    --line: #2d3644;
    --accent: #5fcaca;
    --accent-soft: #163a3c;
    --on-accent: #0b1a1a;
    --warn: #f0b34d;
    --warn-soft: #3a2c10;
    --bad: #ff8f95;
    --bad-soft: #3d1b1e;
    --good: #7fd49a;
    --good-soft: #14301f;
    --tok-keyword: #d79bef;
    --tok-string: #8fd9a8;
    --tok-comment: #8b94a5;
    --tok-func: #7db8f5;
    --tok-number: #f2a864;
    --tok-name: #5fcaca;
  --seg1: #1f4560;
  --seg2: #5a4219;
  --seg3: #46316a;
  --seg4: #1f5133;
  }
}
svg text.term-svg { text-decoration: underline dotted; text-underline-offset: 4px; cursor: help; }
svg text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--text); }
svg .t-muted { fill: var(--muted); }
svg .t-on { fill: var(--on-accent); font-weight: 700; }
svg .lane { stroke: var(--line); stroke-width: 2; stroke-dasharray: 5 6; }
svg .head { fill: var(--surface-2); stroke: var(--line); stroke-width: 1.5; }
svg .note { fill: var(--surface); stroke: var(--line); stroke-width: 1.5; }
svg .arrow { stroke: var(--accent); stroke-width: 2.5; fill: none; }
svg .arrow.back { stroke: var(--muted); stroke-dasharray: 7 5; }
svg .arrow.bad { stroke: var(--bad); stroke-dasharray: 7 5; }
svg .dot { fill: var(--accent); }
svg .zone-bad { fill: var(--warn-soft); stroke: var(--warn); stroke-width: 2; }
svg .zone-good { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 2; }
svg .zone-db { fill: var(--surface-2); stroke: var(--muted); stroke-width: 2; }
svg .strong { font-weight: 700; }
svg text.mono { font-family: ui-monospace, Menlo, Consolas, "DejaVu Sans Mono", monospace; }
svg .seg1 { fill: var(--seg1); }
svg .seg2 { fill: var(--seg2); }
svg .seg3 { fill: var(--seg3); }
svg .seg4 { fill: var(--seg4); }
</style><rect width="1080" height="850" rx="12" fill="var(--surface)"/><line class="lane" x1="160" y1="84" x2="160" y2="830"/><rect class="head" x="55" y="16" width="210" height="62" rx="10"/><text class="strong" x="160" y="43" text-anchor="middle" font-size="17">Browser</text><text class="t-muted" x="160" y="64" text-anchor="middle" font-size="13.5">HTML, CSS and a script</text><line class="lane" x1="560" y1="84" x2="560" y2="830"/><rect class="head" x="455" y="16" width="210" height="62" rx="10"/><text class="strong" x="560" y="43" text-anchor="middle" font-size="17">Server</text><text class="t-muted" x="560" y="64" text-anchor="middle" font-size="13.5">A Node.js program</text><line class="lane" x1="930" y1="84" x2="930" y2="830"/><rect class="head" x="825" y="16" width="210" height="62" rx="10"/><text class="strong" x="930" y="43" text-anchor="middle" font-size="17">Database</text><text class="t-muted" x="930" y="64" text-anchor="middle" font-size="13.5">SQLite file</text><g class="station" data-n="1"><circle class="dot" cx="160" cy="130" r="15"/><text class="t-on" x="160" y="135" text-anchor="middle" font-size="14">1</text><rect class="note" x="186" y="110" width="250" height="40" rx="8"/><text x="198" y="135" font-size="15">The browser notices the click</text></g><g class="station" data-n="2 3"><path class="arrow" d="M 160 200 L 550 200"/><path class="arrow" d="M 548 193 L 560 200 L 548 207"/><text x="360.0" y="188" font-size="14.5" text-anchor="middle">POST /api/slots/A1/buy</text></g><g class="station" data-n="2"><circle class="dot" cx="200" cy="226" r="15"/><text class="t-on" x="200" y="231" text-anchor="middle" font-size="14">2</text><text class="t-muted" x="224" y="231" font-size="13.5">The script builds a request</text></g><g class="station" data-n="3"><circle class="dot" cx="520" cy="252" r="15"/><text class="t-on" x="520" y="257" text-anchor="middle" font-size="14">3</text><text class="t-muted" x="498" y="257" font-size="13.5" text-anchor="end">The request travels to port 8000</text></g><g class="station" data-n="4"><circle class="dot" cx="560" cy="280" r="15"/><text class="t-on" x="560" y="285" text-anchor="middle" font-size="14">4</text><rect class="note" x="586" y="260" width="290" height="40" rx="8"/><text x="598" y="285" font-size="15">The server chooses a handler</text></g><g class="station" data-n="5"><circle class="dot" cx="560" cy="335" r="15"/><text class="t-on" x="560" y="340" text-anchor="middle" font-size="14">5</text><rect class="note" x="586" y="315" width="290" height="40" rx="8"/><text x="598" y="340" font-size="15">The handler checks the input</text></g><g class="station" data-n="6"><path class="arrow" d="M 560 400 L 920 400"/><path class="arrow" d="M 918 393 L 930 400 L 918 407"/><text x="745.0" y="388" font-size="14.5" text-anchor="middle">UPDATE ... SET stock = stock - 1</text><circle class="dot" cx="600" cy="426" r="15"/><text class="t-on" x="600" y="431" text-anchor="middle" font-size="14">6</text><text class="t-muted" x="624" y="431" font-size="13.5">The handler sends SQL to the database</text></g><g class="station" data-n="7"><circle class="dot" cx="930" cy="480" r="15"/><text class="t-on" x="930" y="485" text-anchor="middle" font-size="14">7</text><rect class="note" x="654" y="460" width="250" height="40" rx="8"/><text x="666" y="485" font-size="15">The database changes the row</text><path class="arrow back" d="M 930 535 L 570 535"/><path class="arrow back" d="M 572 528 L 560 535 L 572 542"/><text x="745.0" y="523" font-size="14.5" text-anchor="middle">1 row changed</text></g><g class="station" data-n="8"><circle class="dot" cx="560" cy="590" r="15"/><text class="t-on" x="560" y="595" text-anchor="middle" font-size="14">8</text><rect class="note" x="586" y="570" width="290" height="40" rx="8"/><text x="598" y="595" font-size="15">The handler packages the result</text></g><g class="station" data-n="9"><path class="arrow back" d="M 560 655 L 170 655"/><path class="arrow back" d="M 172 648 L 160 655 L 172 662"/><text x="360.0" y="643" font-size="14.5" text-anchor="middle">200 OK with a JSON body</text><circle class="dot" cx="520" cy="681" r="15"/><text class="t-on" x="520" y="686" text-anchor="middle" font-size="14">9</text><text class="t-muted" x="498" y="686" font-size="13.5" text-anchor="end">The server sends a response</text></g><g class="station" data-n="10"><circle class="dot" cx="160" cy="715" r="15"/><text class="t-on" x="160" y="720" text-anchor="middle" font-size="14">10</text><rect class="note" x="186" y="695" width="330" height="40" rx="8"/><text x="198" y="720" font-size="15">The reply reaches the script</text></g><g class="station" data-n="11"><circle class="dot" cx="160" cy="760" r="15"/><text class="t-on" x="160" y="765" text-anchor="middle" font-size="14">11</text><rect class="note" x="186" y="740" width="330" height="40" rx="8"/><text x="198" y="765" font-size="15">The script changes the DOM</text></g><g class="station" data-n="12"><circle class="dot" cx="160" cy="805" r="15"/><text class="t-on" x="160" y="810" text-anchor="middle" font-size="14">12</text><rect class="note" x="186" y="785" width="330" height="40" rx="8"/><text x="198" y="810" font-size="15">The browser repaints the screen</text></g></svg>
