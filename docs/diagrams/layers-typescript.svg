<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 560" role="img" aria-label="Three layers of the server stacked between the browser and the database. Each layer calls only the one below it, and only the data layer talks to the database."><title>Three layers of the server stacked between the browser and the database. Each layer calls only the one below it, and only the data layer talks to the database.</title><style>
:root {
  --bg: #fbfaf6;
  --surface: #ffffff;
  --surface-2: #f2efe6;
  --code-bg: #f4f1e8;
  --text: #1d2430;
  --muted: #586071;
  --line: #ddd7c8;
  --accent: #0b6e6e;
  --accent-soft: #dcefee;
  --on-accent: #ffffff;
  --warn: #8a5300;
  --warn-soft: #fbefd6;
  --bad: #a4262c;
  --bad-soft: #f8e2e3;
  --good: #25663a;
  --good-soft: #e0f1e5;
  --tok-keyword: #8a2b9b;
  --tok-string: #1c6b3a;
  --tok-comment: #6b7280;
  --tok-func: #0a58a8;
  --tok-number: #a34a00;
  --tok-name: #0b6e6e;
  --seg1: #cfe6f6;
  --seg2: #f6e1be;
  --seg3: #e2d3f3;
  --seg4: #cdeed4;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #12161d;
    --surface: #1a2029;
    --surface-2: #222a36;
    --code-bg: #0f131a;
    --text: #e6e9ef;
    --muted: #a0a9b8;
    --line: #2d3644;
    --accent: #5fcaca;
    --accent-soft: #163a3c;
    --on-accent: #0b1a1a;
    --warn: #f0b34d;
    --warn-soft: #3a2c10;
    --bad: #ff8f95;
    --bad-soft: #3d1b1e;
    --good: #7fd49a;
    --good-soft: #14301f;
    --tok-keyword: #d79bef;
    --tok-string: #8fd9a8;
    --tok-comment: #8b94a5;
    --tok-func: #7db8f5;
    --tok-number: #f2a864;
    --tok-name: #5fcaca;
  --seg1: #1f4560;
  --seg2: #5a4219;
  --seg3: #46316a;
  --seg4: #1f5133;
  }
}
svg text.term-svg { text-decoration: underline dotted; text-underline-offset: 4px; cursor: help; }
svg text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--text); }
svg .t-muted { fill: var(--muted); }
svg .t-on { fill: var(--on-accent); font-weight: 700; }
svg .lane { stroke: var(--line); stroke-width: 2; stroke-dasharray: 5 6; }
svg .head { fill: var(--surface-2); stroke: var(--line); stroke-width: 1.5; }
svg .note { fill: var(--surface); stroke: var(--line); stroke-width: 1.5; }
svg .arrow { stroke: var(--accent); stroke-width: 2.5; fill: none; }
svg .arrow.back { stroke: var(--muted); stroke-dasharray: 7 5; }
svg .arrow.bad { stroke: var(--bad); stroke-dasharray: 7 5; }
svg .dot { fill: var(--accent); }
svg .zone-bad { fill: var(--warn-soft); stroke: var(--warn); stroke-width: 2; }
svg .zone-good { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 2; }
svg .zone-db { fill: var(--surface-2); stroke: var(--muted); stroke-width: 2; }
svg .strong { font-weight: 700; }
svg text.mono { font-family: ui-monospace, Menlo, Consolas, "DejaVu Sans Mono", monospace; }
svg .seg1 { fill: var(--seg1); }
svg .seg2 { fill: var(--seg2); }
svg .seg3 { fill: var(--seg3); }
svg .seg4 { fill: var(--seg4); }
</style><rect width="1080" height="560" rx="12" fill="var(--surface)"/><defs><marker id="ah3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--accent)"/></marker><marker id="ah3b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--muted)"/></marker></defs><rect class="zone-bad" x="40" y="16" width="520" height="48" rx="10"/><text class="strong" x="300.0" y="46" text-anchor="middle" font-size="16">The browser</text><rect class="zone-good" x="40" y="116" width="520" height="84" rx="10"/><text class="strong" x="56" y="144" font-size="17">HTTP layer</text><text x="56" y="172" class="mono" font-size="13.5">answerRequest, sendJson, sendBody</text><text class="t-muted" x="588" y="150" font-size="15">Knows methods, paths, status codes and headers.</text><text class="t-muted" x="588" y="174" font-size="15">Never touches SQL.</text><rect class="zone-good" x="40" y="240" width="520" height="84" rx="10"/><text class="strong" x="56" y="268" font-size="17">Route layer</text><text x="56" y="296" class="mono" font-size="13.5">ROUTES, handleBuySlot, validateSlotId</text><text class="t-muted" x="588" y="274" font-size="15">Knows which URL means which action,</text><text class="t-muted" x="588" y="298" font-size="15">and what a valid slot id looks like.</text><rect class="zone-good" x="40" y="364" width="520" height="84" rx="10"/><text class="strong" x="56" y="392" font-size="17">Data layer</text><text x="56" y="420" class="mono" font-size="13.5">getAllSlots, getSlot, buySlot</text><text class="t-muted" x="588" y="398" font-size="15">Knows SQL, transactions and the rules of the machine.</text><text class="t-muted" x="588" y="422" font-size="15">Never touches HTTP or status codes.</text><rect class="zone-db" x="40" y="488" width="520" height="48" rx="10"/><text class="strong" x="300.0" y="518" text-anchor="middle" font-size="16">The SQLite database</text><path class="arrow" d="M 180 66 L 180 114" marker-end="url(#ah3)"/><text x="192" y="95.0" font-size="13.5">request</text><path class="arrow back" d="M 400 114 L 400 66" marker-end="url(#ah3b)"/><text x="412" y="95.0" font-size="13.5">response</text><path class="arrow" d="M 180 202 L 180 238" marker-end="url(#ah3)"/><text x="192" y="225.0" font-size="13.5">calls a handler</text><path class="arrow back" d="M 400 238 L 400 202" marker-end="url(#ah3b)"/><text x="412" y="225.0" font-size="13.5">data, or an error</text><path class="arrow" d="M 180 326 L 180 362" marker-end="url(#ah3)"/><text x="192" y="349.0" font-size="13.5">calls a data function</text><path class="arrow back" d="M 400 362 L 400 326" marker-end="url(#ah3b)"/><text x="412" y="349.0" font-size="13.5">data, or an error</text><path class="arrow" d="M 180 450 L 180 486" marker-end="url(#ah3)"/><text x="192" y="473.0" font-size="13.5">SQL and values</text><path class="arrow back" d="M 400 486 L 400 450" marker-end="url(#ah3b)"/><text x="412" y="473.0" font-size="13.5">rows</text></svg>
